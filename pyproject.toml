[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawtostep"
version = "0.1.0"
description = "Offline desktop assistant: converts GOST/ESKD engineering drawings of bodies of revolution into editable STEP/STL models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DrawToSTEP Team" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
