name: build-exe

# Builds DrawToSTEP.exe for Windows (jury demo). Triggered manually or for a
# published release. Artifact is uploaded always; release asset only on release.

on:
  workflow_dispatch:
  release:
    types: [published]
  # also build on PRs that touch exe-relevant paths, so the artifact can be
  # downloaded before merge (release upload stays release-only)
  pull_request:
    paths:
      - ".github/workflows/build-exe.yml"
      - "DrawToSTEP.spec"
      - "app/**"
      - "core/**"
      - "requirements.txt"
      - "data/examples/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python --version

      - name: Regenerate the scan example (gitignored, deterministic)
        run: python data/examples/real/generate_real_examples.py

      - name: Build DrawToSTEP.exe
        run: |
          python -m pip show pyinstaller | Write-Host
          python -m PyInstaller --noconfirm DrawToSTEP.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== BUILD FAILED — tail of build.log ====="
            Get-Content build.log -Tail 150
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exe-build-log
          path: build.log
          retention-days: 7

      - name: Smoke test — exe starts, Upload screen first
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = & .\dist\DrawToSTEP.exe --selftest
          $out | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($out -notmatch "SELFTEST OK")) {
            Write-Error "selftest failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Smoke test — headless build demo (STEP/STL via the frozen bundle)
        run: |
          $out = & .\dist\DrawToSTEP.exe --headless data\examples\flange_shaft_demo.pdf --out $env:RUNNER_TEMP\exe_headless
          $out | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($out -notmatch "STEP:")) {
            Write-Error "headless smoke failed (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Render Upload screen screenshot (for docs/artifacts)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & .\dist\DrawToSTEP.exe --screenshot "$env:RUNNER_TEMP\exe_demo.png"
          if ($LASTEXITCODE -ne 0) { Write-Error "screenshot failed" ; exit 1 }

      - name: Upload artifact
        if: always()   # downloadable even if a smoke step fails — status is in the run log
        uses: actions/upload-artifact@v4
        with:
          name: DrawToSTEP-exe
          path: dist/DrawToSTEP.exe
          retention-days: 30

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe_demo-screenshot
          path: ${{ runner.temp }}/exe_demo.png
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/DrawToSTEP.exe --clobber
