name: build-exe

# Builds DrawToSTEP.exe for Windows (jury demo). Triggered manually or for a
# published release. Artifact is uploaded always; release asset only on release.

on:
  workflow_dispatch:
  release:
    types: [published]
  # also build on PRs that touch exe-relevant paths, so the artifact can be
  # downloaded before merge (release upload stays release-only)
  pull_request:
    paths:
      - ".github/workflows/build-exe.yml"
      - "DrawToSTEP.spec"
      - "app/**"
      - "core/**"
      - "requirements.txt"
      - "data/examples/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          function Emit-Log-Tail($file, $max) {
            $i = 0
            Get-Content $file -Tail $max | ForEach-Object {
              $l = ($_ -replace '%', '%25') -replace '[\r\n]', ' '
              if ($l.Trim() -and $i -lt 12) {
                Write-Output ("::error::" + $l)
                $i++
              }
            }
          }
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt > deps_install.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "requirements install failed - emitting log tail as annotations"
            Emit-Log-Tail deps_install.log 40
            exit 1
          }
          python -m pip install pyinstaller > pyinstaller_install.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pyinstaller install failed - emitting log tail as annotations"
            Emit-Log-Tail pyinstaller_install.log 40
            exit 1
          }
          python --version
          python -m PyInstaller --version

      - name: Regenerate the scan example (gitignored, deterministic)
        run: python data/examples/real/generate_real_examples.py

      - name: Build DrawToSTEP.exe
        run: |
          python -m pip show pyinstaller | Write-Host
          python -m PyInstaller --noconfirm DrawToSTEP.spec 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== BUILD FAILED — tail of build.log ====="
            Get-Content build.log -Tail 150 | Write-Host
            $i = 0
            Get-Content build.log -Tail 40 | ForEach-Object {
              $l = ($_ -replace '%', '%25') -replace '[\r\n]', ' '
              if ($l.Trim() -and $i -lt 12) {
                Write-Output ("::error::" + $l)
                $i++
              }
            }
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exe-build-log
          path: build.log
          retention-days: 7

      - name: Smoke test — exe starts, Upload screen first
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "1"
        run: |
          $report = Join-Path $env:TEMP "drawtostep_ci_report.txt"
          Remove-Item $report -ErrorAction SilentlyContinue
          $sout = Join-Path $env:RUNNER_TEMP "selftest_out.txt"
          $serr = Join-Path $env:RUNNER_TEMP "selftest_err.txt"
          # PowerShell does NOT wait for GUI-subsystem exes launched with & — use Start-Process -Wait
          try {
            $proc = Start-Process -FilePath ".\dist\DrawToSTEP.exe" -ArgumentList "--selftest" `
              -Wait -PassThru -RedirectStandardOutput $sout -RedirectStandardError $serr
            $code = $proc.ExitCode
          } catch {
            Write-Host "Start-Process failed: $_"
            Write-Output ("::error::Start-Process failed: " + ($_ -replace '%','%25'))
            exit 1
          }
          Write-Host "exit code: $code"
          function Emit($line) {
            $l = ($line -replace '%', '%25') -replace '[\r\n]', ' '
            if ($l.Trim()) { Write-Output ("::error::" + $l) }
          }
          Write-Output ("::error::selftest exit code: " + $code)
          $i = 0
          foreach ($f in @($sout, $serr)) {
            if (Test-Path $f) {
              Get-Content $f | ForEach-Object { if ($i -lt 25) { Emit $_; $i++ } }
            }
          }
          Write-Host "===== ci report file ====="
          if (Test-Path $report) {
            Get-Content $report | ForEach-Object { Write-Host $_; Emit $_ }
          } else {
            Write-Host "(no report file written)"
            Write-Output "::error::no ci report file — the exe likely crashed before python could report (native fault or Qt plugin failure)"
          }
          if ($code -ne 0) { exit 1 }

      - name: Smoke test — headless build demo (STEP/STL via the frozen bundle)
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "exe_headless"
          $sout = Join-Path $env:RUNNER_TEMP "headless_out.txt"
          $serr = Join-Path $env:RUNNER_TEMP "headless_err.txt"
          try {
            $proc = Start-Process -FilePath ".\dist\DrawToSTEP.exe" -Wait -PassThru `
              -ArgumentList "--headless","data\examples\flange_shaft_demo.pdf","--out",$outDir `
              -RedirectStandardOutput $sout -RedirectStandardError $serr
            $code = $proc.ExitCode
          } catch {
            Write-Host "Start-Process failed: $_"
            Write-Output ("::error::Start-Process failed (headless): " + ($_ -replace '%','%25'))
            exit 1
          }
          Write-Host "exit code: $code"
          function Emit($line) {
            $l = ($line -replace '%', '%25') -replace '[\r\n]', ' '
            if ($l.Trim()) { Write-Output ("::error::" + $l) }
          }
          $i = 0
          foreach ($f in @($sout, $serr)) {
            if (Test-Path $f) {
              Get-Content $f | ForEach-Object { Write-Host $_; if ($i -lt 15) { Emit $_; $i++ } }
            }
          }
          $step = Join-Path $outDir "flange_shaft_demo.step"
          $stl = Join-Path $outDir "flange_shaft_demo.stl"
          if ($code -ne 0) {
            Write-Output "::error::headless smoke failed with exit code $code"
            exit 1
          }
          foreach ($f in @($step, $stl)) {
            if (-not (Test-Path $f) -or ((Get-Item $f).Length -lt 1000)) {
              Write-Output "::error::expected output missing or suspiciously small: $f"
              exit 1
            }
          }
          Write-Host "step: $((Get-Item $step).Length) bytes; stl: $((Get-Item $stl).Length) bytes"

      - name: Render Upload screen screenshot (for docs/artifacts)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & .\dist\DrawToSTEP.exe --screenshot "$env:RUNNER_TEMP\exe_demo.png"
          if ($LASTEXITCODE -ne 0) { Write-Error "screenshot failed" ; exit 1 }

      - name: Upload artifact
        if: always()   # downloadable even if a smoke step fails — status is in the run log
        uses: actions/upload-artifact@v4
        with:
          name: DrawToSTEP-exe
          path: dist/DrawToSTEP.exe
          retention-days: 30

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe_demo-screenshot
          path: ${{ runner.temp }}/exe_demo.png
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/DrawToSTEP.exe --clobber
